<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#0a0a1a" />
  <title>Sky Blasty</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      overflow: hidden;
      background: #0a0a1a;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Courier New', monospace;
      width: 100vw;
      height: 100vh;
    }
    #game-canvas {
      display: block;
      width: 100vw;
      height: 100vh;
      touch-action: none;
    }
    .overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(5, 5, 20, 0.85);
      z-index: 10;
    }
    .menu {
      text-align: center;
      padding: 2rem;
    }
    h1 {
      font-size: clamp(2rem, 8vw, 4rem);
      color: #4af;
      text-shadow: 0 0 20px rgba(68, 170, 255, 0.6);
      margin: 0 0 0.5rem 0;
      letter-spacing: 2px;
    }
    .subtitle {
      color: #8af;
      font-size: 1.1rem;
      margin-bottom: 2rem;
    }
    button {
      font-family: 'Courier New', monospace;
      font-size: 1.4rem;
      font-weight: bold;
      padding: 1rem 3rem;
      background: linear-gradient(135deg, #4af, #28d);
      color: #fff;
      border: 2px solid #6cf;
      border-radius: 12px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 0 30px rgba(68, 170, 255, 0.4);
      -webkit-tap-highlight-color: transparent;
    }
    button:active {
      transform: scale(0.95);
      box-shadow: 0 0 15px rgba(68, 170, 255, 0.6);
    }
    .instructions {
      margin-top: 2rem;
      color: #88a;
      font-size: 0.95rem;
      line-height: 1.8;
    }
    .highscore {
      margin-top: 1.5rem;
      color: #fc0;
      font-size: 1.2rem;
    }
    .final-score {
      font-size: 2rem;
      color: #4af;
      margin: 1rem 0;
    }
    .new-record {
      color: #fc0;
      font-size: 1.3rem;
      animation: pulse 0.8s infinite alternate;
    }
    @keyframes pulse {
      from { opacity: 0.6; }
      to { opacity: 1; }
    }
    .hud {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.8rem 1.2rem;
      z-index: 5;
      pointer-events: none;
    }
    .hud-left, .hud-right {
      display: flex;
      align-items: center;
      gap: 1rem;
    }
    .hud-score {
      color: #ff0;
      font-size: 1.3rem;
      font-weight: bold;
      text-shadow: 0 0 8px rgba(255, 255, 0, 0.5);
    }
    .hud-level {
      color: #8af;
      font-size: 1rem;
      background: rgba(0, 0, 0, 0.4);
      padding: 0.2rem 0.6rem;
      border-radius: 6px;
    }
    .heart { font-size: 1.2rem; }
    .powerup-flash {
      position: fixed;
      top: 30%;
      left: 50%;
      transform: translateX(-50%);
      color: #fff;
      font-size: 1.5rem;
      font-weight: bold;
      text-shadow: 0 0 15px currentColor;
      z-index: 6;
      pointer-events: none;
      animation: flashIn 1.5s ease-out forwards;
    }
    @keyframes flashIn {
      0% { opacity: 0; transform: translateX(-50%) translateY(-10px) scale(0.5); }
      20% { opacity: 1; transform: translateX(-50%) translateY(0) scale(1.2); }
      40% { transform: translateX(-50%) translateY(0) scale(1); }
      100% { opacity: 0; transform: translateX(-50%) translateY(-20px) scale(1); }
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="hud" class="hud hidden">
    <div class="hud-left">
      <span class="hud-score">⭐ <span id="score-val">0</span></span>
      <span class="hud-level">Lvl <span id="level-val">1</span></span>
    </div>
    <div class="hud-right" id="lives-val"></div>
  </div>

  <div id="powerup-flash" class="powerup-flash hidden"></div>

  <div id="menu-overlay" class="overlay">
    <div class="menu" id="menu-content">
      <h1>🚀 SKY BLASTY</h1>
      <p class="subtitle">Top-Down Arcade Shooter</p>
      <button id="start-btn">SPIELEN</button>
      <div class="instructions">
        <p>👆 Finger bewegen = Fliegen</p>
        <p>🔥 Auto-Fire ist aktiv</p>
        <p>⭐ Sammle Power-ups ein!</p>
      </div>
    </div>
  </div>

<script>
(function() {
  'use strict';

  const canvas = document.getElementById('game-canvas');
  const ctx = canvas.getContext('2d');

  // UI elements
  const menuOverlay = document.getElementById('menu-overlay');
  const menuContent = document.getElementById('menu-content');
  const startBtn = document.getElementById('start-btn');
  const hud = document.getElementById('hud');
  const scoreVal = document.getElementById('score-val');
  const levelVal = document.getElementById('level-val');
  const livesVal = document.getElementById('lives-val');
  const powerupFlash = document.getElementById('powerup-flash');

  let W = 0, H = 0;
  let gameState = 'menu';
  let score = 0, highScore = 0, lives = 3, level = 1;

  let player, bullets, enemies, enemyBullets, particles, powerups, stars;
  let enemySpawnTimer, enemySpawnRate, powerupSpawnTimer, fireTimer;
  const fireRate = 200;
  let weaponLevel, shieldActive, shieldTimer;
  let touchX = 0, touchY = 0, touchActive = false;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * dpr;
    canvas.height = H * dpr;
    canvas.style.width = W + 'px';
    canvas.style.height = H + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (stars) createStars();
  }

  function createStars() {
    stars = [];
    for (let i = 0; i < 80; i++) {
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H,
        size: Math.random() * 2 + 0.5,
        speed: Math.random() * 60 + 20,
        alpha: Math.random() * 0.8 + 0.2,
      });
    }
  }

  function resetGame() {
    score = 0;
    lives = 3;
    level = 1;
    weaponLevel = 1;
    shieldActive = false;
    bullets = [];
    enemies = [];
    enemyBullets = [];
    particles = [];
    powerups = [];
    enemySpawnRate = 1500;
    enemySpawnTimer = 0;
    powerupSpawnTimer = 0;
    fireTimer = 0;
    player = {
      x: W / 2,
      y: H - 120,
      w: 36, h: 40,
      speed: 350,
      hitbox: 14,
    };
  }

  function startGame() {
    resetGame();
    gameState = 'playing';
    menuOverlay.classList.add('hidden');
    hud.classList.remove('hidden');
    updateHUD();
  }

  function showMenu() {
    gameState = 'menu';
    menuContent.innerHTML = `
      <h1>🚀 SKY BLASTY</h1>
      <p class="subtitle">Top-Down Arcade Shooter</p>
      <button id="start-btn">SPIELEN</button>
      <div class="instructions">
        <p>👆 Finger bewegen = Fliegen</p>
        <p>🔥 Auto-Fire ist aktiv</p>
        <p>⭐ Sammle Power-ups ein!</p>
      </div>
      ${highScore > 0 ? `<p class="highscore">🏆 High Score: ${highScore}</p>` : ''}
    `;
    document.getElementById('start-btn').addEventListener('click', startGame);
    menuOverlay.classList.remove('hidden');
    hud.classList.add('hidden');
  }

  function showGameOver() {
    gameState = 'gameover';
    const isRecord = score >= highScore && score > 0;
    if (score > highScore) highScore = score;
    menuContent.innerHTML = `
      <h1>💥 GAME OVER</h1>
      <p class="final-score">Score: ${score}</p>
      ${isRecord ? '<p class="new-record">🏆 Neuer Rekord!</p>' : ''}
      <button id="start-btn">NOCHMAL</button>
    `;
    document.getElementById('start-btn').addEventListener('click', startGame);
    menuOverlay.classList.remove('hidden');
    hud.classList.add('hidden');
  }

  function updateHUD() {
    scoreVal.textContent = score;
    levelVal.textContent = level;
    livesVal.innerHTML = '❤️'.repeat(lives);
  }

  function fire() {
    const p = player;
    const speed = 550;
    if (weaponLevel === 1) {
      bullets.push({ x: p.x, y: p.y - 20, vx: 0, vy: -speed });
    } else if (weaponLevel === 2) {
      bullets.push({ x: p.x - 8, y: p.y - 15, vx: 0, vy: -speed });
      bullets.push({ x: p.x + 8, y: p.y - 15, vx: 0, vy: -speed });
    } else {
      bullets.push({ x: p.x, y: p.y - 20, vx: 0, vy: -speed });
      bullets.push({ x: p.x - 12, y: p.y - 10, vx: -80, vy: -speed * 0.9 });
      bullets.push({ x: p.x + 12, y: p.y - 10, vx: 80, vy: -speed * 0.9 });
    }
  }

  function spawnEnemy() {
    const types = [
      { hp: 1, w: 28, h: 28, vy: 100 + level * 10, color: '#e55', points: 10, hitbox: 14, sway: 0, canShoot: false },
      { hp: 1, w: 24, h: 30, vy: 140 + level * 12, color: '#fc5', points: 15, hitbox: 12, sway: 40, canShoot: false },
      { hp: 3, w: 40, h: 40, vy: 70 + level * 8, color: '#c5f', points: 30, hitbox: 20, sway: 20, canShoot: true, fireInterval: 2500 },
      { hp: 2, w: 32, h: 32, vy: 90 + level * 10, color: '#5cf', points: 20, hitbox: 16, sway: 60, canShoot: false },
    ];
    const weights = level >= 3 ? [3, 3, 2, 2] : [4, 3, 1, 2];
    const total = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * total, idx = 0;
    for (let i = 0; i < weights.length; i++) { r -= weights[i]; if (r <= 0) { idx = i; break; } }
    const t = types[idx];
    enemies.push({
      ...t, maxHp: t.hp,
      x: Math.random() * (W - 60) + 30,
      y: -30,
      phase: Math.random() * Math.PI * 2,
      fireTimer: Math.random() * 1000,
    });
  }

  function spawnPowerup() {
    const types = ['weapon', 'shield', 'life'];
    const weights = [5, 3, 1];
    const total = weights.reduce((a, b) => a + b, 0);
    let r = Math.random() * total, idx = 0;
    for (let i = 0; i < weights.length; i++) { r -= weights[i]; if (r <= 0) { idx = i; break; } }
    powerups.push({
      x: Math.random() * (W - 60) + 30,
      y: -20, vy: 80,
      type: types[idx], pulse: 0,
    });
  }

  function collectPowerup(type) {
    if (type === 'weapon') {
      weaponLevel = Math.min(3, weaponLevel + 1);
    } else if (type === 'shield') {
      shieldActive = true;
      shieldTimer = 5000;
    } else if (type === 'life') {
      lives = Math.min(5, lives + 1);
    }
    const names = { weapon: '⚡ Waffen-Upgrade!', shield: '🛡️ Schild!', life: '❤️ +1 Leben!' };
    powerupFlash.textContent = names[type] || '';
    powerupFlash.classList.remove('hidden');
    powerupFlash.style.animation = 'none';
    void powerupFlash.offsetWidth;
    powerupFlash.style.animation = 'flashIn 1.5s ease-out forwards';
    setTimeout(() => powerupFlash.classList.add('hidden'), 1500);
    updateHUD();
  }

  function hitPlayer() {
    if (shieldActive) {
      createParticles(player.x, player.y, '#4cf', 15);
      return;
    }
    lives--;
    createParticles(player.x, player.y, '#f55', 20);
    updateHUD();
    if (lives <= 0) {
      gameState = 'gameover';
      showGameOver();
    } else {
      shieldActive = true;
      shieldTimer = 1500;
      weaponLevel = Math.max(1, weaponLevel - 1);
    }
  }

  function createParticles(x, y, color, count) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = Math.random() * 200 + 50;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        color, life: Math.random() * 0.5 + 0.3,
        maxLife: 0.8, alpha: 1,
        size: Math.random() * 3 + 1,
      });
    }
  }

  function update(dt) {
    for (const s of stars) {
      s.y += s.speed * dt;
      if (s.y > H) { s.y = -5; s.x = Math.random() * W; }
    }
    if (gameState !== 'playing') return;

    const p = player;
    if (touchActive) {
      const dx = touchX - p.x;
      const dy = touchY - p.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist > 2) {
        const move = Math.min(dist, p.speed * dt);
        p.x += (dx / dist) * move;
        p.y += (dy / dist) * move;
      }
    }
    p.x = Math.max(p.w / 2, Math.min(W - p.w / 2, p.x));
    p.y = Math.max(p.h / 2, Math.min(H - p.h / 2, p.y));

    fireTimer += dt * 1000;
    if (fireTimer >= fireRate) { fireTimer = 0; fire(); }

    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.y += b.vy * dt; b.x += b.vx * dt;
      if (b.y < -20 || b.x < -20 || b.x > W + 20) bullets.splice(i, 1);
    }

    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const b = enemyBullets[i];
      b.y += b.vy * dt; b.x += b.vx * dt;
      if (b.y > H + 20 || b.x < -20 || b.x > W + 20) { enemyBullets.splice(i, 1); continue; }
      const dx = b.x - p.x, dy = b.y - p.y;
      if (Math.sqrt(dx * dx + dy * dy) < p.hitbox + b.r) { enemyBullets.splice(i, 1); hitPlayer(); }
    }

    enemySpawnTimer += dt * 1000;
    if (enemySpawnTimer >= enemySpawnRate) { enemySpawnTimer = 0; spawnEnemy(); }

    powerupSpawnTimer += dt * 1000;
    if (powerupSpawnTimer >= 12000) { powerupSpawnTimer = 0; spawnPowerup(); }

    for (let i = enemies.length - 1; i >= 0; i--) {
      const en = enemies[i];
      en.y += en.vy * dt;
      en.x += Math.sin(en.y * 0.01 + en.phase) * en.sway * dt;

      if (en.canShoot) {
        en.fireTimer += dt * 1000;
        if (en.fireTimer >= en.fireInterval) {
          en.fireTimer = 0;
          const adx = p.x - en.x, ady = p.y - en.y;
          const adist = Math.sqrt(adx * adx + ady * ady) || 1;
          enemyBullets.push({ x: en.x, y: en.y, vx: (adx / adist) * 200, vy: (ady / adist) * 200, r: 5, color: '#f44' });
        }
      }

      if (en.y > H + 50) { enemies.splice(i, 1); continue; }

      for (let j = bullets.length - 1; j >= 0; j--) {
        const b = bullets[j];
        const dx = b.x - en.x, dy = b.y - en.y;
        if (Math.sqrt(dx * dx + dy * dy) < en.hitbox + 4) {
          bullets.splice(j, 1);
          en.hp -= 1;
          createParticles(b.x, b.y, '#ff8', 4);
          if (en.hp <= 0) {
            score += en.points;
            createParticles(en.x, en.y, en.color, 12);
            enemies.splice(i, 1);
            updateHUD();
            break;
          }
        }
      }

      if (en.y > 0) {
        const dx = en.x - p.x, dy = en.y - p.y;
        if (Math.sqrt(dx * dx + dy * dy) < p.hitbox + en.hitbox) {
          createParticles(en.x, en.y, en.color, 10);
          enemies.splice(i, 1);
          hitPlayer();
        }
      }
    }

    for (let i = powerups.length - 1; i >= 0; i--) {
      const pu = powerups[i];
      pu.y += pu.vy * dt; pu.pulse += dt * 4;
      if (pu.y > H + 30) { powerups.splice(i, 1); continue; }
      const dx = pu.x - p.x, dy = pu.y - p.y;
      if (Math.sqrt(dx * dx + dy * dy) < p.hitbox + 16) { collectPowerup(pu.type); powerups.splice(i, 1); }
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const pt = particles[i];
      pt.x += pt.vx * dt; pt.y += pt.vy * dt;
      pt.life -= dt; pt.alpha = pt.life / pt.maxLife;
      if (pt.life <= 0) particles.splice(i, 1);
    }

    if (shieldActive) {
      shieldTimer -= dt * 1000;
      if (shieldTimer <= 0) shieldActive = false;
    }

    const newLevel = 1 + Math.floor(score / 500);
    if (newLevel > level) {
      level = newLevel;
      enemySpawnRate = Math.max(400, 1500 - (level - 1) * 120);
      updateHUD();
    }
  }

  function render() {
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0a0a2a');
    grad.addColorStop(0.5, '#0d1b3a');
    grad.addColorStop(1, '#0a0a1a');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    for (const s of stars) {
      ctx.globalAlpha = s.alpha;
      ctx.fillStyle = '#fff';
      ctx.fillRect(s.x, s.y, s.size, s.size);
    }
    ctx.globalAlpha = 1;

    if (gameState !== 'playing') return;

    for (const b of bullets) {
      ctx.fillStyle = b.vx !== 0 ? '#fa0' : '#0f0';
      ctx.shadowBlur = 8; ctx.shadowColor = ctx.fillStyle;
      ctx.fillRect(b.x - 2, b.y - 8, 4, 16);
    }
    ctx.shadowBlur = 0;

    for (const b of enemyBullets) {
      ctx.fillStyle = b.color || '#f44';
      ctx.shadowBlur = 6; ctx.shadowColor = '#f44';
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
    }
    ctx.shadowBlur = 0;

    for (const en of enemies) {
      ctx.fillStyle = en.color;
      ctx.shadowBlur = 6; ctx.shadowColor = en.color;
      ctx.beginPath();
      if (en.canShoot) {
        const r = en.w / 2;
        for (let i = 0; i < 6; i++) {
          const a = (Math.PI / 3) * i + Math.PI / 6;
          const px = en.x + Math.cos(a) * r, py = en.y + Math.sin(a) * r;
          if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
        }
      } else {
        ctx.moveTo(en.x, en.y + en.h / 2);
        ctx.lineTo(en.x - en.w / 2, en.y - en.h / 2);
        ctx.lineTo(en.x + en.w / 2, en.y - en.h / 2);
      }
      ctx.closePath(); ctx.fill();

      if (en.hp > 1 && en.hp < en.maxHp) {
        ctx.shadowBlur = 0;
        ctx.fillStyle = '#333'; ctx.fillRect(en.x - 15, en.y - en.h / 2 - 8, 30, 4);
        ctx.fillStyle = '#0f0'; ctx.fillRect(en.x - 15, en.y - en.h / 2 - 8, 30 * (en.hp / en.maxHp), 4);
      }
    }
    ctx.shadowBlur = 0;

    for (const pu of powerups) {
      const pulse = Math.sin(pu.pulse) * 3;
      const colors = { weapon: '#0f0', shield: '#4cf', life: '#f4f' };
      const labels = { weapon: 'W', shield: 'S', life: '+' };
      ctx.fillStyle = colors[pu.type] || '#fff';
      ctx.shadowBlur = 10; ctx.shadowColor = colors[pu.type] || '#fff';
      ctx.beginPath(); ctx.arc(pu.x, pu.y, 14 + pulse, 0, Math.PI * 2); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#000'; ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(labels[pu.type] || '?', pu.x, pu.y);
    }

    for (const pt of particles) {
      ctx.globalAlpha = pt.alpha;
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - pt.size / 2, pt.y - pt.size / 2, pt.size, pt.size);
    }
    ctx.globalAlpha = 1;

    const p = player;
    ctx.save();
    ctx.translate(p.x, p.y);

    if (shieldActive) {
      ctx.strokeStyle = 'rgba(80,200,255,' + (0.4 + Math.sin(Date.now() / 100) * 0.2) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(0, 0, p.hitbox + 12, 0, Math.PI * 2); ctx.stroke();
    }

    ctx.fillStyle = '#4af';
    ctx.shadowBlur = 10; ctx.shadowColor = '#4af';
    ctx.beginPath();
    ctx.moveTo(0, -p.h / 2);
    ctx.lineTo(-p.w / 2, p.h / 2);
    ctx.lineTo(-p.w / 4, p.h / 3);
    ctx.lineTo(0, p.h / 2);
    ctx.lineTo(p.w / 4, p.h / 3);
    ctx.lineTo(p.w / 2, p.h / 2);
    ctx.closePath(); ctx.fill();

    ctx.shadowBlur = 0;
    ctx.fillStyle = '#0df';
    ctx.beginPath(); ctx.arc(0, -p.h / 6, 5, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = 'rgba(255,150,0,' + (0.5 + Math.random() * 0.3) + ')';
    ctx.fillRect(-4, p.h / 2 - 2, 8, 6);
    ctx.restore();
  }

  let lastTime = 0;
  function loop(ts) {
    if (!lastTime) lastTime = ts;
    const dt = Math.min(0.05, (ts - lastTime) / 1000);
    lastTime = ts;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }

  // Input
  function getPos(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  canvas.addEventListener('touchstart', function(e) {
    e.preventDefault();
    if (gameState !== 'playing') return;
    const t = e.touches[0];
    const pos = getPos(t.clientX, t.clientY);
    touchX = pos.x; touchY = pos.y; touchActive = true;
  }, { passive: false });

  canvas.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (gameState !== 'playing') return;
    const t = e.touches[0];
    const pos = getPos(t.clientX, t.clientY);
    touchX = pos.x; touchY = pos.y; touchActive = true;
  }, { passive: false });

  canvas.addEventListener('touchend', function() { touchActive = false; });

  canvas.addEventListener('mousedown', function(e) {
    if (gameState !== 'playing') return;
    const pos = getPos(e.clientX, e.clientY);
    touchX = pos.x; touchY = pos.y; touchActive = true;
  });

  canvas.addEventListener('mousemove', function(e) {
    if (gameState !== 'playing' || !e.buttons) return;
    const pos = getPos(e.clientX, e.clientY);
    touchX = pos.x; touchY = pos.y; touchActive = true;
  });

  canvas.addEventListener('mouseup', function() { touchActive = false; });

  window.addEventListener('resize', resize);
  window.addEventListener('orientationchange', function() { setTimeout(resize, 100); });

  // Prevent scrolling
  document.addEventListener('touchmove', function(e) { e.preventDefault(); }, { passive: false });

  // Init
  resize();
  createStars();
  startBtn.addEventListener('click', startGame);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
